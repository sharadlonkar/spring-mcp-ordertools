spring.application.name=mcp-server

# --- MCP server ---
spring.ai.mcp.server.name=order-tools
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.type=SYNC
# Streamable HTTP transport: JSON-RPC 2.0 over a single endpoint (default path /mcp),
# with optional SSE upgrade for streamed server messages.
spring.ai.mcp.server.protocol=STREAMABLE

server.port=8080