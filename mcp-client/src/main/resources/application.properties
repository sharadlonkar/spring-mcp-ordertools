spring.application.name=mcp-client

# CLI app: no web server, no banner, quiet logs so tool output is clean.
spring.main.web-application-type=none
spring.main.banner-mode=off
logging.level.root=WARN
# These providers log a harmless WARN when no sampling/elicitation handlers exist; quiet them.
logging.level.org.springaicommunity.mcp.provider=ERROR
# Suppress the verbose connect-failure stack traces; main() prints a friendly message instead.
logging.level.io.modelcontextprotocol=OFF
logging.level.org.springframework.boot.SpringApplication=OFF
logging.level.org.springframework.context.annotation.AnnotationConfigApplicationContext=OFF

# --- MCP client ---
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.name=order-cli
spring.ai.mcp.client.request-timeout=30s

# Streamable HTTP connection to the order-tools server (matches /mcp endpoint).
spring.ai.mcp.client.streamable-http.connections.order-server.url=http://localhost:8080
spring.ai.mcp.client.streamable-http.connections.order-server.endpoint=/mcp