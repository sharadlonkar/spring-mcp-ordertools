# Activated only with the "external" profile:
#   mvn -pl mcp-client spring-boot:run -Dspring-boot.run.profiles=external
#   java -jar mcp-client.jar --spring.profiles.active=external <command>
#
# Loads the STDIO MCP servers (GitHub, Jira, Splunk) defined in mcp-servers.json.
# Each entry is launched as a subprocess at startup, so the matching runtime
# (docker / uvx) and the credentials in mcp-servers.json must be in place — an
# unreachable server here will fail client startup.
spring.ai.mcp.client.stdio.servers-configuration=classpath:mcp-servers.json